<!doctype html>
<html lang="ru" style="background: #eceeeb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eceeeb" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>UzHa: где город перегревается летом</title>
    <meta name="description" content="Острова тепла Ташкента, Самарканда и Бухары по снимкам Landsat: где поверхность горячее всего летом и почему." />

    <!-- Link previews (Telegram, WhatsApp, X). The image is made by `npm run og`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UzHa" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://uzha.mydevbox.xyz/" />
    <meta property="og:title" content="UzHa: где города Узбекистана перегреваются летом и почему" />
    <meta property="og:description" content="Летом поверхность Ташкента на 1,8° горячее окрестностей, Самарканда на 1,4°, Бухары на 3,0°: карта по снимкам Landsat 2023–2025 и что греет каждый участок." />
    <meta property="og:image" content="https://uzha.mydevbox.xyz/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Изотермы поверхности Ташкента и надпись: Где Ташкент перегревается, +1,8°" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UzHa: где города Узбекистана перегреваются летом и почему" />
    <meta name="twitter:description" content="Летом поверхность Ташкента на 1,8° горячее окрестностей, Самарканда на 1,4°, Бухары на 3,0°: карта по снимкам Landsat 2023–2025 и что греет каждый участок." />
    <meta name="twitter:image" content="https://uzha.mydevbox.xyz/og.jpg" />
  </head>
  <body>
    <!--
      The first screen before the app runs, in the page's own classes: the bar, the headline and the map panel
      with the city outline. The app reports the download into it and removes it when the page is ready.
    -->
    <div id="boot" class="boot" data-city="__UZHA_CITY_ID__">
      <header class="bar">
        <a href="/" class="bar__id">UzHa</a>
        <nav class="bar__nav" aria-label="Разделы">
          <a href="#problem">Проблема</a>
          <a href="#why">Почему жарко</a>
          <a href="#cities">Города</a>
          <a href="#method">Как считали</a>
        </nav>
        <a class="pill pill--ink bar__open" href="/map/__UZHA_CITY_ID__">
          <span class="bar__open-long">Открыть карту</span>
          <span class="bar__open-short" aria-hidden="true">Карта</span>
        </a>
      </header>
      <main aria-busy="true">
        <section class="hero boot__hero">
          <h1 class="hero__title">Где __UZHA_CITY_NAME__ перегревается летом и&nbsp;почему</h1>
          <div class="hero__island" aria-hidden="true">
            <p class="hero__figure boot__figure">+0,0°</p>
            <div class="boot__lines"><i></i><i></i><i></i><i class="boot__short"></i><i></i><i class="boot__short"></i></div>
            <div class="boot__lines hero__people"><i></i><i class="boot__short"></i><i class="boot__short"></i></div>
          </div>
        </section>
        <section class="live">
          <div class="live__face boot__face">
            <svg class="boot__outline" data-boot-outline viewBox="__UZHA_OUTLINE_VIEWBOX__" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
              <path d="__UZHA_OUTLINE_D__" />
            </svg>
            <div class="boot__progress">
              <p role="status" data-boot-status>загружаю данные</p>
              <span class="boot__meter is-open"><span data-boot-meter></span></span>
            </div>
          </div>
          <aside class="live__side" aria-hidden="true">
            <div class="gauge">
              <p class="gauge__label">температура поверхности, доля города</p>
              <span class="boot__ramp"></span>
              <div class="boot__lines gauge__hint"><i></i><i></i><i class="boot__short"></i></div>
            </div>
            <span class="pill pill--big live__open boot__pill"></span>
          </aside>
        </section>
      </main>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
