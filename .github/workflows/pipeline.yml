name: pipeline

on:
  pull_request:
    paths: ["pipeline/**", ".github/workflows/pipeline.yml"]
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/pipeline.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt pytest
      - run: python -m pytest pipeline/tests -q
